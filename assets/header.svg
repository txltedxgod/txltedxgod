<svg width="960" height="260" viewBox="0 0 960 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Obsidian Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="960" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0e12"/>
      <stop offset="50%" stop-color="#12151c"/>
      <stop offset="100%" stop-color="#0e1017"/>
    </linearGradient>

    <!-- Subtle Monochrome Border -->
    <linearGradient id="card-border" x1="0" y1="0" x2="960" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>

    <!-- Accent Line -->
    <linearGradient id="accent-line" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- Subtle Technical Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.035"/>
    </pattern>

    <!-- Ambient Top Glow -->
    <radialGradient id="top-glow" cx="45%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", Roboto, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: 4px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: "JetBrains Mono", "Fira Code", monospace, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 2.2px;
      fill: #d4d4d8;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      font-size: 13.5px;
      fill: #a1a1aa;
      letter-spacing: 0.3px;
    }
    .terminal-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 11.5px;
      fill: #a1a1aa;
    }
    .terminal-user {
      fill: #e4e4e7;
      font-weight: 700;
    }
    .badge-text {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #e4e4e7;
    }

  </style>

  <!-- Base Card Background -->
  <rect width="960" height="260" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Subtle Grid -->
  <rect width="960" height="260" rx="16" fill="url(#grid)"/>

  <!-- Radial Ambient Glow -->
  <rect width="960" height="260" rx="16" fill="url(#top-glow)"/>

  <!-- Sleek 1px Glass Border -->
  <rect x="0.75" y="0.75" width="958.5" height="258.5" rx="15.25" fill="none" stroke="url(#card-border)" stroke-width="1.5"/>

  <!-- Top Console Bar -->
  <g transform="translate(38, 30)">
    <!-- 3 Subtle Monochrome Window Dots -->
    <circle cx="6" cy="6" r="4" fill="#ffffff" opacity="0.25"/>
    <circle cx="20" cy="6" r="4" fill="#ffffff" opacity="0.25"/>
    <circle cx="34" cy="6" r="4" fill="#ffffff" opacity="0.25"/>
    
    <text x="52" y="10" class="terminal-tag"><tspan class="terminal-user">txltedxgod@systems:~$</tspan> whoami --spec</text>
  </g>

  <!-- Main Identity Header -->
  <g transform="translate(38, 98)">
    <text x="0" y="0" class="title">TXLTEDXGOD</text>
    <circle cx="320" cy="-12" r="4.5" fill="#ffffff"/>
    <circle cx="320" cy="-12" r="8" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Accent Divider Line -->
  <rect x="38" y="114" width="480" height="1.5" fill="url(#accent-line)" rx="1"/>

  <!-- Subtitle / Role -->
  <text x="38" y="140" class="subtitle">SYSTEMS ARCHITECT &amp; SOFTWARE ENGINEER</text>

  <!-- Description Line -->
  <text x="38" y="168" class="desc">High-Throughput Distributed Engines · Low-Latency Systems · Production Infrastructure</text>

  <!-- Tech Badges Strip -->
  <g transform="translate(38, 196)">
    <!-- Badge: Rust -->
    <rect x="0" y="0" width="68" height="24" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
    <text x="34" y="16" text-anchor="middle" class="badge-text">Rust</text>

    <!-- Badge: Go -->
    <rect x="76" y="0" width="56" height="24" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
    <text x="104" y="16" text-anchor="middle" class="badge-text">Go</text>

    <!-- Badge: Modern C++17 -->
    <rect x="140" y="0" width="80" height="24" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
    <text x="180" y="16" text-anchor="middle" class="badge-text">C++17</text>

    <!-- Badge: Python -->
    <rect x="228" y="0" width="76" height="24" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
    <text x="266" y="16" text-anchor="middle" class="badge-text">Python</text>

    <!-- Badge: Kubernetes -->
    <rect x="312" y="0" width="100" height="24" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
    <text x="362" y="16" text-anchor="middle" class="badge-text">Kubernetes</text>

    <!-- Badge: Kafka -->
    <rect x="420" y="0" width="70" height="24" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
    <text x="455" y="16" text-anchor="middle" class="badge-text">Kafka</text>
  </g>

  <!-- Right-Side Graphic: Architectural Isometric Systems Node & Radar -->
  <g transform="translate(805, 130)">
    <!-- Outer Radar Rings -->
    <circle cx="0" cy="0" r="74" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 6" opacity="0.14"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 4" opacity="0.18"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="6 6" opacity="0.22"/>

    <!-- Isometric Systems Cube Node (Exactly as on Portfolio Website) -->
    <g transform="scale(1.35)">
      <polygon points="0 -22 19 -11 19 11 0 22 -19 11 -19 -11" stroke="#ffffff" stroke-width="1.75" fill="#ffffff" fill-opacity="0.04" stroke-linejoin="round"/>
      <polyline points="-19 -11 0 0 19 -11" stroke="#ffffff" stroke-width="1.75" stroke-linejoin="round"/>
      <line x1="0" y1="0" x2="0" y2="22" stroke="#ffffff" stroke-width="1.75"/>
      <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
      <circle cx="0" cy="-22" r="2" fill="#ffffff"/>
      <circle cx="19" cy="-11" r="2" fill="#ffffff"/>
      <circle cx="19" cy="11" r="2" fill="#ffffff"/>
      <circle cx="0" cy="22" r="2" fill="#ffffff"/>
      <circle cx="-19" cy="11" r="2" fill="#ffffff"/>
      <circle cx="-19" cy="-11" r="2" fill="#ffffff"/>
    </g>
  </g>
</svg>
