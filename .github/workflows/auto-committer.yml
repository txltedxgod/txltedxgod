name: Scheduled Activity Sync

on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '43 8 * * *'
    - cron: '28 14 * * *'
    - cron: '51 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run Activity Pulse
        run: python scripts/sync_activity.py

      - name: Commit and Push Heartbeat
        run: |
          git config user.name "txltedxgod"
          git config user.email "txltedxgod@users.noreply.github.com"
          git add ACTIVITY.md
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore(pulse): heartbeat sync $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push
          fi
