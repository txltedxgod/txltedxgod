name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: txltedxgod
          outputs: |
            assets/github-contribution-grid-snake.svg?color_snake=#00f2fe&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00f2fe&color_dots=#161b22,#0d4429,#006d32,#26a641,#39d353

      - name: Commit and push snake assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg
          if git diff --staged --quiet; then
            echo "No changes in snake animation"
          else
            git commit -m "chore(visual): update contribution snake animation [skip ci]"
            git push
          fi
